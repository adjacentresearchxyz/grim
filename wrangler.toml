name = "grim"
main = "src/worker.ts"
compatibility_date = "2024-03-10"
compatibility_flags = ["nodejs_compat"]

[vars]
TELEGRAM_BOT_TOKEN = ""
ANTHROPIC_API_KEY = ""

[[kv_namespaces]]
binding = "GRIM_SESSIONS"
id = "" # Replace with actual KV namespace ID when deploying
preview_id = "" # Replace with actual preview KV namespace ID when testing

# Cron Trigger
# This is for webhook cleanup, disabled by default
# [triggers]
# crons = ["0 0 * * *"] # Run daily at midnight UTC

[observability]
enabled = true
head_sampling_rate = 1 # optional. default = 1.